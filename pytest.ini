[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps the default run readable; -ra surfaces the reason behind every xfail/skip,
# which is where the known-defect markers live.
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=prepend

markers =
    integration: builds a real Level end to end from generated .agl/.agd data
    slow: takes noticeably longer than a unit test

filterwarnings =
    default

# Headless SDL is forced inside tests/conftest.py before pygame is imported, so the
# suite needs no environment set up by the caller.
